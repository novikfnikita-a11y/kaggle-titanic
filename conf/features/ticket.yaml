# @package features.ticket
# фичи из Ticket , Fare. 
# python train.py features@features.ticket=ticket

derived:
  TicketPrefix:
    enabled: true
    type: categorical
    inputs: Ticket
    op: ticket_prefix
    encode: onehot
  FarePerPerson:
    enabled: true
    type: numeric
    inputs: [Fare, SibSp, Parch]
    op: fare_per_person
    impute:
      strategy: median
    scale: standard
    log1p: true
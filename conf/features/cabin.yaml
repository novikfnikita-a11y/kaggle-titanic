# @package features.cabin
# 
# вкл = python train.py features@features.cabin=cabin

derived:
  HasCabin:
    enabled: true
    source: Cabin
    op: not_null
  Deck:
    enabled: true
    source: Cabin
    extract: first_char
    impute:
      strategy: constant
      value: "U"       # u = unknown 
    encode: onehot
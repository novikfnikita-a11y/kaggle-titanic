# @package features.cabin
# 
# вкл = python train.py features@features.cabin=cabin

derived:
  HasCabin:
    enabled: true
    type: numeric
    inputs: Cabin
    op: not_null
  Deck:
    enabled: true
    type: categorical
    inputs: Cabin
    op: first_char
    impute:
      strategy: constant
      value: "U"
    encode: onehot
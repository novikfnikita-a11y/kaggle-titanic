name: RandomForestClassifier

estimator:
  _target_: sklearn.ensemble.RandomForestClassifier
  n_estimators: 400
  max_depth: 7
  min_samples_leaf: 1
  min_samples_split: 2
  max_features: sqrt
  random_state: ${seed}

search:
  clf__n_estimators: [200, 400]
  clf__max_depth: [5,6, 7,8]
  clf__min_samples_leaf: [1, 2,  3]
  clf__min_samples_split: [2, 4]
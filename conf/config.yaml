defaults:
  - model: logreg
  - features@features.basic: basic          
  - features@features.family: null          
  - features@features.cabin: null
  - features@features.identity: null
  - features@features.ticket: null
  - _self_

mlflow:
  experiment_name: "titanic-baseline"
  tracking_uri: "http://127.0.0.1:5000"
  run_name: "${model.name}"

seed: 42

data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  target: Survived
  id_column: PassengerId

cv:
  splitter: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: ${seed}

output:
  save_model: true
  save_oof: true
  save_feature_importance: true

# понял что для билдера лучше ордер вынести
features:
  column_order: ["basic", "family", "cabin", "identity", "ticket"]

hydra:
  run:
    dir: outputs/${mlflow.experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
  
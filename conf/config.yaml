defaults:
  - model: logreg
  - features: baseline
  - _self_


mlflow:
  experiment_name: "titanic-baseline"
  tracking_uri: "http://127.0.0.1:5000"


seed: 
  42 

data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  target: Survived
  id_column: PassengerId


CV: 
  spliter: stratified_kfold
  n_spits: 5
  shuffle : True 
  random_state: ${seed}

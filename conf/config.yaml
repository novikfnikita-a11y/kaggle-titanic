defaults:
  - features
  - model: logreg
  - feature_set: baseline
  - imputation: age_group_median
  - encoding: frequency
  - preprocessing: onehot
  - _self_

mlflow:
  experiment_name: "titanic-baseline"
  tracking_uri: "http://127.0.0.1:5000"
  run_name: null
  register_model: false
  register_if_better_than: null

seed: 42

cli:
  model_uri: null
  run_id: null
  output_path: null
  score: null
  source: public

data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  target: Survived
  id_column: PassengerId

cv:
  splitter: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: ${seed}
  aggregate: fold_ensemble

hydra:
  run:
    dir: outputs/${mlflow.experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false

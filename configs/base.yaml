seed: 42
model_config: models/logreg.yaml

data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  target: Survived
  id_column: PassengerId

cv:
  splitter: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: ${seed}

features:
  base:
    numeric:
      - Age
      - SibSp
      - Parch
      - Fare
    categorical:
      - Pclass
      - Sex
      - Embarked
  active_experiment: baseline
  experiments:
    baseline: {}
    family_size:
      exclude_numeric:
        - SibSp
        - Parch
      add_numeric:
        - FamilySize
    family_size_title:
      exclude_numeric:
        - SibSp
        - Parch
      add_numeric:
        - FamilySize
      add_categorical:
        - Title
